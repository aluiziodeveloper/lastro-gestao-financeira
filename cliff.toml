# O changelog do Lastro, gerado pelo git-cliff a partir dos commits no
# formato do Conventional Commits. Só as tags v* são versões; as capNN
# do livro não entram. Cada tipo de commit vira uma seção.

[changelog]
header = """
# Changelog

Todas as mudanças do Lastro, geradas dos commits semânticos.\n
"""
# #region corpo
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%d/%m/%Y") }})
{% else %}\
## Não lançado
{% endif %}\
{% for grupo, commits in commits | group_by(attribute="group") %}
### {{ grupo | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.breaking %} (**incompatível**){% endif %}\
{% endfor %}
{% endfor %}\n
"""
# #endregion
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
# #region tipos
# O comentário HTML só ordena as seções; o striptags o tira do texto.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Novidades" },
  { message = "^fix", group = "<!-- 1 -->Correções" },
  { message = "^refactor", group = "<!-- 2 -->Refatorações" },
  { message = "^docs: adiciona changelog", skip = true },
  { message = "^docs", group = "<!-- 3 -->Documentação" },
  { message = "^test", group = "<!-- 4 -->Testes" },
  { message = "^build", group = "<!-- 5 -->Build" },
  { message = "^ci", group = "<!-- 6 -->Integração contínua" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 7 -->Manutenção" },
]
# #endregion
